version: '3.8'

# ====================================================================
# MediCore Production-Grade Multi-Service Architecture
# Assessment 09: Docker Healthcare Environment
# Isolated networks, non-root users, persistent volumes, healthchecks
# ====================================================================

networks:
  medicore-frontend-net:
    driver: bridge
  medicore-backend-net:
    internal: true # Database is strictly private & isolated from external ingress
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

services:
  # 1. System of Record: PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: medicore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medicore}
      POSTGRES_USER: ${POSTGRES_USER:-medicore_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurePassword2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - medicore-backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicore_user -d medicore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Caching & Asynchronous Jobs: Redis 7
  redis:
    image: redis:7-alpine
    container_name: medicore-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-ChangeMeRedisPass2026!}"]
    volumes:
      - redis_data:/data
    networks:
      - medicore-backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Core Business API: Node.js / Express
  core-backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: medicore-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-medicore_user}:${POSTGRES_PASSWORD:-ChangeMeSecurePassword2026!}@postgres:5432/${POSTGRES_DB:-medicore}
      JWT_SECRET: ${JWT_SECRET:-medicore-super-secure-production-ready-jwt-secret-key-2026}
      JWT_EXPIRES_IN: 24h
      ANALYTICS_SERVICE_URL: http://analytics-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medicore-frontend-net
      - medicore-backend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 4. Clinical Analytics Microservice: Python / FastAPI
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: ../docker/Dockerfile.analytics
    container_name: medicore-analytics
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql://${POSTGRES_USER:-medicore_user}:${POSTGRES_PASSWORD:-ChangeMeSecurePassword2026!}@postgres:5432/${POSTGRES_DB:-medicore}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medicore-frontend-net
      - medicore-backend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 5. User Interface: Next.js App Router
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: medicore-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
      NEXT_PUBLIC_ANALYTICS_URL: http://localhost/api/v1/analytics
    depends_on:
      - core-backend
      - analytics-service
    networks:
      - medicore-frontend-net

  # 6. Reverse Proxy & SSL Gateway: Nginx
  reverse-proxy:
    image: nginx:alpine
    container_name: medicore-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - core-backend
      - analytics-service
    networks:
      - medicore-frontend-net
